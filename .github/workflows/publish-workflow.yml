# Publishes On-Set Studio to the Comfy Registry, which is what ComfyUI-Manager
# installs from.
#
# It runs whenever pyproject.toml changes on main, so releasing becomes one
# edit: bump the `version` field, write the CHANGELOG entry, push. Nothing
# else triggers it, so ordinary commits to editor_dist or the docs will not
# publish a release by accident.
#
# BEFORE THIS CAN WORK:
#   1. Create a publisher at registry.comfy.org and copy the id from after
#      the @ on your profile. It is permanent, so choose carefully.
#   2. Create an API key for that publisher.
#   3. In this repo: Settings > Secrets and variables > Actions > New
#      repository secret. Name it exactly REGISTRY_ACCESS_TOKEN.
#   4. Fill PublisherId in pyproject.toml.
#
# The version published is whatever pyproject.toml says, and the Registry uses
# semantic versioning: a breaking change to a node's inputs or outputs is a
# MAJOR bump, so users can see at a glance whether an update will break their
# workflow. Renaming a socket on the On-Set Studio node counts.
#
# workflow_dispatch is included so you can also publish by hand from the
# Actions tab without touching the file, which is useful if a publish fails
# and you want to retry it.

name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish custom node to the registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
